[project]
name = "{{PYTHON_DIST_NAME}}"
version = "0.1.0"
description = "{{PROJECT_DESCRIPTION}}"
authors = [{ name = "{{OWNER_NAME}}" }]
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.poetry]
packages = [{ include = "{{PYTHON_PACKAGE}}", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9,<10"
pytest-cov = ">=7,<8"
ruff = ">=0.12,<1"
mypy = ">=1.17,<2"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov={{PYTHON_PACKAGE}} --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["{{PYTHON_PACKAGE}}"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
