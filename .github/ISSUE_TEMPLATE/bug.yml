name: Bug report
description: Report reproducible incorrect behaviour.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What happened? Include exact errors where safe.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Smallest reliable steps, inputs, environment and frequency.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, test output, screenshots or traces. Remove secrets.
  - type: textarea
    id: context
    attributes:
      label: Environment and versions
